name: Deploy Kromoak to Plesk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kromoak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate static files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f css/app.css
          test -f js/config.js
          test -f js/api.js
          test -f js/collection.js
          test -f js/keypad.js
          test -f js/modal.js
          test -f js/app.js
          test -f js/pwa.js

          test -f favicon.ico
          test -f robots.txt
          test -f manifest.json
          test -f sw.js

          test -f apple-touch-icon.png
          test -f apple-touch-icon-152x152.png
          test -f apple-touch-icon-precomposed.png
          test -f img/icons/icon-192.png
          test -f img/icons/icon-512.png

      - name: Validate ES5 compatibility
        shell: bash
        run: |
          set -e

          for file in js/*.js sw.js; do
            echo "Checking $file"

            npx --yes --package=acorn@8.19.0 \
              acorn --ecma5 --silent "$file"
          done

      - name: Validate web app manifest
        shell: bash
        run: |
          python3 -m json.tool manifest.json > /dev/null

      - name: Upload and deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "index.html,favicon.ico,robots.txt,manifest.json,sw.js,apple-touch-icon*.png,css,js,img"
          target: ${{ secrets.REMOTE_PUBLIC_DIR }}
          overwrite: true
          rm: false
