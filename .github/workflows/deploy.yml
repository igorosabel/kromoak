name: Deploy Kromoak to Plesk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kromoak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate static files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f css/app.css
          test -f js/config.js
          test -f js/api.js
          test -f js/collection.js
          test -f js/keypad.js
          test -f js/modal.js
          test -f js/app.js
          test -f favicon.ico
          test -f robots.txt

      - name: Validate ES5 compatibility
        shell: bash
        run: |
          set -e

          for file in js/*.js; do
            echo "Checking $file"

            npx --yes --package=acorn@8.19.0 \
              acorn --ecma5 --silent "$file"
          done

      - name: Upload and deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "index.html,favicon.ico,robots.txt,css,js"
          target: ${{ secrets.REMOTE_PUBLIC_DIR }}
          overwrite: true
          rm: false
