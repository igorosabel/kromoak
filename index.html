<!DOCTYPE html>
<html lang="eu">

    <head>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <link rel="icon"
              type="image/x-icon"
              href="/favicon.ico">
        <meta name="robots"
              content="noindex, nofollow, noarchive, nosnippet, noimageindex">

        <meta name="theme-color"
              content="#211c19">
        <meta name="apple-mobile-web-app-capable"
              content="yes">
        <meta name="apple-mobile-web-app-status-bar-style"
              content="black">
        <meta name="apple-mobile-web-app-title"
              content="Kromoak">

        <title>Kromoak</title>

        <link rel="stylesheet"
              href="css/app.css">
    </head>

    <body>
        <main id="app">

            <section id="welcome-screen"
                     class="screen welcome-screen">
                <div class="welcome-content">

                    <div class="brand">
                        <span class="brand-star"
                              aria-hidden="true">✦</span>
                        <h1>KROMOAK</h1>
                        <span class="brand-star"
                              aria-hidden="true">✦</span>
                    </div>

                    <div class="brand-decoration"
                         aria-hidden="true">
                        <span>◆</span>
                    </div>

                    <h2>Aukeratu zure bilduma</h2>

                    <div id="users-list"
                         class="users-list"></div>

                    <p id="welcome-message"
                       class="screen-message"
                       role="status"></p>

                    <button id="retry-users-button"
                            class="primary-button"
                            type="button"
                            hidden>
                        Saiatu berriro
                    </button>

                    <p class="christmas-message">
                        ✦ Gabonetako bilduma ✦
                    </p>

                </div>
            </section>

            <section id="collection-screen"
                     class="screen collection-screen"
                     hidden>

                <header class="collection-header">

                    <button id="back-button"
                            class="back-button"
                            type="button"
                            aria-label="Itzuli">
                        &#8592; Itzuli
                    </button>

                    <div class="collection-heading">
                        <h2 id="collection-title"></h2>
                        <span>Nire bilduma</span>
                    </div>

                    <div class="collection-progress">
                        <strong id="collection-progress-text">
                            0 / 0
                        </strong>

                        <div class="progress-track">
                            <div id="collection-progress-bar"
                                 class="progress-bar"></div>
                        </div>
                    </div>

                </header>

                <div id="collection-scroll"
                     class="collection-scroll">

                    <div id="collection-board"
                         class="collection-board"></div>

                </div>

                <div class="collection-footer">

                    <span id="collection-message"
                          role="status"></span>

                    <button id="retry-collection-button"
                            class="small-button"
                            type="button"
                            hidden>
                        Saiatu berriro
                    </button>

                </div>

            </section>

            <div id="card-modal"
                 class="modal-overlay"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="unlock-title"
                 tabindex="-1"
                 hidden>

                <div id="unlock-panel"
                     class="modal-panel">

                    <div class="safe-lock"
                         aria-hidden="true"></div>

                    <h2 id="unlock-title">Desblokeatu kromoa</h2>

                    <p id="unlock-card-number"
                       class="unlock-card-number"></p>

                    <p class="modal-description">
                        Sartu lau digituko kodea
                    </p>

                    <div id="code-display"
                         class="code-display">
                        <span class="code-digit">–</span>
                        <span class="code-digit">–</span>
                        <span class="code-digit">–</span>
                        <span class="code-digit">–</span>
                    </div>

                    <div id="keypad"
                         class="keypad">

                        <button type="button"
                                data-key="1">1</button>
                        <button type="button"
                                data-key="2">2</button>
                        <button type="button"
                                data-key="3">3</button>

                        <button type="button"
                                data-key="4">4</button>
                        <button type="button"
                                data-key="5">5</button>
                        <button type="button"
                                data-key="6">6</button>

                        <button type="button"
                                data-key="7">7</button>
                        <button type="button"
                                data-key="8">8</button>
                        <button type="button"
                                data-key="9">9</button>

                        <button type="button"
                                data-key="clear"
                                class="keypad-special"
                                aria-label="Garbitu">
                            C
                        </button>

                        <button type="button"
                                data-key="0">0</button>

                        <button type="button"
                                data-key="delete"
                                class="keypad-special"
                                aria-label="Ezabatu">
                            &#9003;
                        </button>

                    </div>

                    <p id="unlock-message"
                       class="modal-message"
                       role="status"></p>

                    <div id="unlock-countdown"
                         class="unlock-countdown"
                         hidden></div>

                    <button id="unlock-submit-button"
                            class="modal-primary-button"
                            type="button"
                            disabled>
                        Desblokeatu
                    </button>

                    <button id="unlock-cancel-button"
                            class="modal-secondary-button"
                            type="button">
                        Utzi
                    </button>

                </div>

                <div id="image-panel"
                     class="modal-panel image-panel"
                     hidden>

                    <div id="reveal-lock"
                         class="safe-lock safe-lock-open"
                         aria-hidden="true"
                         hidden></div>

                    <h2 id="image-title"></h2>

                    <p id="image-name"
                       class="modal-description"
                       hidden></p>

                    <p id="image-message"
                       class="modal-message"
                       role="status"></p>

                    <img id="modal-card-image"
                         class="modal-card-image"
                         alt=""
                         draggable="false"
                         hidden>

                    <div id="collection-celebration"
                         class="collection-celebration"
                         hidden>

                        <div class="celebration-stars"
                             aria-hidden="true">
                            ✦ ★ ✦ ★ ✦
                        </div>

                        <p>Zorionak!</p>

                        <span>Kromo guztiak lortu dituzu!</span>

                    </div>

                    <button id="image-close-button"
                            class="modal-primary-button"
                            type="button">
                        Itxi
                    </button>

                </div>

            </div>

        </main>

        <noscript>
            Kromoak erabiltzeko JavaScript aktibatu behar duzu.
        </noscript>

        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/collection.js"></script>
        <script src="js/keypad.js"></script>
        <script src="js/modal.js"></script>
        <script src="js/app.js"></script>
    </body>

</html>
